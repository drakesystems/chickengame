<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>CHICKEN — Risk-Taking Driving Game</title>
<style>
  :root{ --amber:#FFC93C; }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    margin:0;
    background: radial-gradient(1200px 700px at 50% -10%, #1D2A3E 0%, #0B0F18 70%);
    display:flex;align-items:center;justify-content:center;
    padding:16px;
    font-family:"Trebuchet MS","Segoe UI",Verdana,sans-serif;
    overflow:hidden;
  }
  .frame{ width:100%;max-width:1000px; }
  .screen{
    position:relative;width:100%;aspect-ratio:960/650;border-radius:14px;overflow:hidden;
    background:#7FD8F7;
    box-shadow: 0 0 0 4px #0B0F18, 0 0 0 8px #2A3547, 0 18px 50px rgba(0,0,0,.55);
  }
  canvas{display:block;width:100%;height:100%}
  .hint{
    margin:12px 2px 0;display:flex;justify-content:space-between;align-items:center;gap:12px;
    color:#7F91AC;font-size:12px;letter-spacing:.14em;text-transform:uppercase;
  }
  .hint b{color:#C9D8EC;font-weight:700}
  .key{
    display:inline-block;padding:3px 9px;border-radius:5px;
    background:#1B2434;border:1px solid #33415A;border-bottom-width:3px;
    color:#DCE7F5;font-size:11px;letter-spacing:.1em;
  }
  button.mute{
    background:#1B2434;border:1px solid #33415A;color:#8FA3BF;
    border-radius:6px;padding:5px 10px;font:inherit;font-size:11px;
    letter-spacing:.12em;cursor:pointer;text-transform:uppercase;
  }
  button.mute:hover{color:#DCE7F5;border-color:#4B5F80}
  button.mute:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
  @media (max-width:560px){ .hint{font-size:10px} }
</style>
</head>
<body>
<div class="frame">
  <div class="screen"><canvas id="game" aria-label="Chicken driving game"></canvas></div>
  <div class="hint">
    <span>
      <span class="key">Space</span> <b>Start / Stop on yellow</b> &nbsp;·&nbsp;
      <b>5 rounds — one red ends the run</b> &nbsp;·&nbsp;
      <span class="key">R</span> <b>Restart run</b>
    </span>
    <span style="display:flex;gap:8px">
      <button class="mute" id="restart" type="button">Restart run</button>
      <button class="mute" id="mute" type="button">Sound: On</button>
    </span>
  </div>
</div>

<script>
(function(){
"use strict";

/* ================= setup ================= */
var cvs = document.getElementById('game');
var ctx = cvs.getContext('2d');
var W = 960, H = 650;
function resize(){
  var dpr = Math.min(window.devicePixelRatio || 1, 2);
  cvs.width = Math.round(W*dpr); cvs.height = Math.round(H*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
resize();
window.addEventListener('resize', resize);

/* ================= palette ================= */
var C = {
  skyTop:'#4FC5F0', skyBot:'#C7EFFF', sun:'#FFE9A3',
  hill:'#3FA95A', grass:'#5AC46B', grassDark:'#46A957',
  road:'#3E4553', roadTop:'#5A6272', roadBot:'#272C37', dash:'#E8EEF6',
  curbA:'#F2F5FA', curbB:'#E24B4B',
  car:'#FF4757', carDark:'#C22239', carLite:'#FF8F98', glass:'#A9E7FF',
  ink:'#171A21', boxA:'#252B37', boxB:'#161A23',
  green:'#3EE07A', amber:'#FFC93C', red:'#FF3B3B', off:'#2A303C',
  brick:'#C0563A', brickDark:'#8E3A24', mortar:'#E6D7C6', gold:'#FFD34D',
  ruler:'#E9F1FA', rulerDim:'rgba(255,255,255,.55)'
};

/* ================= audio ================= */
var AC = null, soundOn = true;
var muteBtn = document.getElementById('mute');
muteBtn.addEventListener('click', function(){
  soundOn = !soundOn;
  muteBtn.textContent = 'Sound: ' + (soundOn ? 'On' : 'Off');
  muteBtn.blur();
});
function beep(freq, dur, type, vol){
  if(!soundOn) return;
  try{
    if(!AC) AC = new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state === 'suspended') AC.resume();
    var o = AC.createOscillator(), g = AC.createGain();
    o.type = type||'square'; o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, AC.currentTime);
    g.gain.exponentialRampToValueAtTime(vol||0.06, AC.currentTime+0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, AC.currentTime+dur);
    o.connect(g); g.connect(AC.destination);
    o.start(); o.stop(AC.currentTime+dur+0.02);
  }catch(e){}
}
function noiseThud(){
  if(!soundOn) return;
  try{
    if(!AC) AC = new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state === 'suspended') AC.resume();
    var len = Math.floor(AC.sampleRate*0.45);
    var buf = AC.createBuffer(1, len, AC.sampleRate);
    var d = buf.getChannelData(0);
    for(var i=0;i<len;i++){ d[i] = (Math.random()*2-1) * Math.pow(1-i/len, 2.4); }
    var s = AC.createBufferSource(); s.buffer = buf;
    var f = AC.createBiquadFilter(); f.type='lowpass'; f.frequency.value=900;
    var g = AC.createGain(); g.gain.value = 0.32;
    s.connect(f); f.connect(g); g.connect(AC.destination);
    s.start();
  }catch(e){}
}

/* ================= geometry ================= */
var HORIZON = 320, ROAD_TOP = 372, ROAD_BOT = 462, GROUND = 440;
var CONTROL_BAR_Y = 552;   // everything below this is the dashboard, not the road scene
var CAR_X = 210, CAR_LEN = 128;
var CRUISE = 160;              // px/s the moment yellow opens
var YELLOW_ACCEL = 85;         // px/s² — the car keeps winding up all through yellow
var MAX_SPEED = 520;           // px/s ceiling
var BRAKE_DECEL = 900;         // px/s² of the stopping glide

/* ================= scoring =================
   ONE LIGHT = ONE ROUND. Five rounds make a run, and the wall ends it —
   there is no bank to fall back on, you start again from round 1.

   DISTANCE — the only points, and they are earned ONLY while the light is
   yellow. Green pays nothing, braking pays nothing. The car accelerates
   the whole time yellow is up, so each extra second is worth more than
   the one before it.

   SPEED BONUS — paid once, at the end of a clean five-round run, on the
   average speed you held across the whole run. Every round costs the same
   fixed dead time (the green roll-up, the brake, the standing start), so
   the only way to raise that average is to push deeper into the yellow
   and let the car wind up. Going further on yellow IS the fast line.   */
var PPX = 0.25;                 // points per pixel of travel
var TOTAL_ROUNDS = 5;           // five lights, five rounds

var YELLOW_MIN = 1.8, YELLOW_MAX = 7.0;   // seconds of yellow, re-rolled per round
var WALL_LEAD = 60;                       // px the wall drops ahead of the bumper
var GREEN_TIME = 0.9;                     // seconds of green before yellow opens

var SPEED_BONUS_RATE = 8;       // bonus points per px/s of average speed over CRUISE

function randRange(a,b){ return a + Math.random()*(b-a); }
function rollYellowTime(){
  return randRange(YELLOW_MIN, YELLOW_MAX);
}
function avgSpeed(){
  return runTime > 0.2 ? runDist/runTime : 0;
}
function speedBonusNow(){
  return Math.max(0, Math.round((avgSpeed() - CRUISE) * SPEED_BONUS_RATE));
}

/* ================= state ================= */
var ST = {
  TITLE:0, ROUND_READY:1, ENTER:2, MOVING:3, BRAKING:4,
  RED:5, RESOLVE_ROUND:6, RESOLVE_CRASH:7, GAMEOVER:8, OVER:9, GREEN:10
};
var state = ST.TITLE, st = 0;

var round = 0;                 // 0-indexed, 0..TOTAL_ROUNDS-1
var score = 0, shownScore = 0; // distance points across the whole run
var roundPoints = 0;           // distance points earned in the current round
var scoredTravel = 0;          // px travelled while yellow this run (drives the ruler)
var runTime = 0, runDist = 0;  // whole-run clock and odometer, for the speed bonus
var finalBonus = 0, finalTotal = 0;
var runLost = false;           // true once the wall has ended the run
var yellowTime = 0, yellowLimit = 0;
var results = [];              // 'clear' per round survived
var bestScore = 0;

var car, light, wall;          // light: 'off' | 'green' | 'yellow' | 'red'
var travel = 0, spin = 0, shake = 0, flash = 0, banner = null;
var bits = [], floats = [], clouds = [];

for(var ci=0; ci<5; ci++){
  clouds.push({x: Math.random()*W, y: 60+Math.random()*140, s: 0.7+Math.random()*0.9, v: 6+Math.random()*10});
}

function newRoundReady(){
  roundPoints = 0;
  yellowTime = 0; yellowLimit = rollYellowTime();
  car = {x:-190, v:0, enter:0, dead:false, squash:0, tilt:0, visV:0};
  light = 'green';
  wall = {up:false, rise:0, x:0, landed:false};
  banner = null; bits = [];
  state = ST.ROUND_READY; st = 0;
}

/* A run is all five rounds. The wall wipes it — this is the only reset. */
function startRun(){
  round = 0; results = [];
  score = 0; shownScore = 0; scoredTravel = 0;
  runTime = 0; runDist = 0; runLost = false;
  finalBonus = 0; finalTotal = 0;
  newRoundReady();
}

function beginRound(){
  if(state !== ST.ROUND_READY) return;
  beep(660,0.08,'square',0.05);
  state = ST.ENTER; st = 0;
}

function pressStop(){
  if(state !== ST.MOVING) return;
  // Stopping while yellow is up is immediately safe: the hidden yellow timer
  // is cancelled the instant the player commits. Only the visual glide runs on.
  car.visV = car.v;
  state = ST.BRAKING; st = 0;
  beep(260,0.12,'sawtooth',0.05);
}

/* Stopped on yellow = round survived. Its distance points are already in the
   score; the run rolls straight on to the next light. */
function passRound(){
  var pts = Math.round(roundPoints);
  results.push('clear');
  light = 'green';
  banner = {big:'ROUND '+(round+1)+' CLEAR', sub:'+'+pts+' DISTANCE', col:C.green};
  floats.push({x:car.x+CAR_LEN-20, y:GROUND-108, txt:'+'+pts, col:C.gold, life:1.0, vy:-40, size:26});
  beep(880,0.09,'square',0.055);
  setTimeout(function(){ beep(1180,0.11,'square',0.05); }, 85);
  state = ST.RESOLVE_ROUND; st = 0;
}

/* Five rounds survived. The speed bonus is settled here, on the average
   speed held across the entire run. */
function finishRun(){
  finalBonus = speedBonusNow();
  finalTotal = Math.round(score) + finalBonus;
  bestScore = Math.max(bestScore, finalTotal);
  state = ST.OVER; st = 0;
  beep(660,0.12,'square',0.05);
  setTimeout(function(){ beep(880,0.16,'square',0.05); }, 130);
  setTimeout(function(){ beep(1180,0.20,'square',0.05); }, 260);
}

/* Each of the five rounds gets its own independently rolled yellow window. */
function openYellow(){
  light = 'yellow';
  yellowTime = 0; yellowLimit = rollYellowTime();
  state = ST.MOVING; st = 0;
  beep(520,0.08,'square',0.05);
}

/* The yellow window ran out. Red always drops the wall — there is no roll. */
function turnRed(){
  light = 'red';
  // lead scales with speed so the wall always lands before you reach it
  wall.x = car.x + CAR_LEN + Math.max(WALL_LEAD, car.v*0.28);
  wall.up = true; wall.rise = 0; wall.landed = false;
  shake = Math.max(shake, 10);
  beep(180,0.20,'sawtooth',0.08);
  state = ST.RED; st = 0;
}

/* The wall ends the run outright — everything goes, back to round 1. */
function crash(){
  var lost = Math.round(score) + speedBonusNow();
  runLost = true;
  car.dead = true; car.v = 0; car.squash = 1; car.tilt = 0.9;
  shake = 26; flash = 1;
  noiseThud(); beep(120,0.35,'sawtooth',0.10);
  banner = {big:'CRASH!', sub:'RAN THE RED IN ROUND '+(round+1)+' — RUN OVER', col:C.red};
  floats.push({x:car.x+CAR_LEN-30, y:GROUND-118, txt:'-'+lost, col:'#FF7A7A', life:1.3, vy:-34, size:28});
  score = 0; roundPoints = 0;
  spawnDebris(wall.x, true);
  state = ST.RESOLVE_CRASH; st = 0;
}

function nextRound(){
  round++;
  if(round >= TOTAL_ROUNDS) finishRun();
  else newRoundReady();
}

/* ================= input ================= */
var BTN_BEGIN  = {x: W/2-110, y: 578, w: 220, h: 56};
var BTN_STOP   = {x: W/2-130, y: 578, w: 260, h: 56};

function hit(b, mx, my){ return mx>=b.x && mx<=b.x+b.w && my>=b.y && my<=b.y+b.h; }
function atStartScreen(){ return state===ST.TITLE || state===ST.OVER || state===ST.GAMEOVER; }

window.addEventListener('keydown', function(e){
  if(e.code === 'Space' || e.code === 'Enter'){
    e.preventDefault();
    if(atStartScreen()){ beep(660,0.09,'square',0.05); startRun(); }
    else if(state===ST.ROUND_READY){ beginRound(); }
    else if(state===ST.MOVING){ pressStop(); }
    return;
  }
  var k = e.key ? e.key.toLowerCase() : '';
  if(k === 'r'){ e.preventDefault(); beep(500,0.09,'square',0.05); startRun(); }
});

cvs.addEventListener('pointerdown', function(e){
  e.preventDefault();
  var r = cvs.getBoundingClientRect();
  var mx = (e.clientX - r.left) * (W/r.width);
  var my = (e.clientY - r.top) * (H/r.height);

  if(atStartScreen()){ beep(660,0.09,'square',0.05); startRun(); return; }
  if(state === ST.ROUND_READY && hit(BTN_BEGIN, mx, my)){ beginRound(); return; }
  if(state === ST.MOVING && hit(BTN_STOP, mx, my)){ pressStop(); return; }
});

document.getElementById('restart').addEventListener('click', function(){
  beep(500,0.09,'square',0.05); startRun(); this.blur();
});

/* ================= debris ================= */
function spawnDebris(atX, big){
  var n = big ? 26 : 10;
  for(var i=0;i<n;i++){
    bits.push({
      x: atX + Math.random()*26, y: GROUND - Math.random()*140,
      vx: 90 + Math.random()*300, vy: -180 - Math.random()*300,
      rot: Math.random()*6, vr: (Math.random()-0.5)*14,
      s: 10 + Math.random()*10, life: 1.4 + Math.random()*0.6, smoke:false
    });
  }
  if(big){
    for(var j=0;j<10;j++){
      bits.push({
        x: atX - 20 + Math.random()*30, y: GROUND - 40 - Math.random()*50,
        vx: -40 - Math.random()*90, vy: -70 - Math.random()*110,
        rot:0, vr:0, s: 16+Math.random()*18, life: 0.9+Math.random()*0.5, smoke:true
      });
    }
  }
}

/* ================= update ================= */
/* Every pixel the car covers, in any phase, counts on the run odometer —
   that plus the run clock is the average speed the bonus is paid on. */
function roll(px){ travel += px; spin += px; runDist += px; }

function update(dt){
  st += dt;
  shownScore += (score - shownScore) * Math.min(1, dt*9);
  if(Math.abs(score-shownScore) < 0.6) shownScore = score;
  shake = Math.max(0, shake - dt*46);
  flash = Math.max(0, flash - dt*2.6);

  for(var c=0;c<clouds.length;c++){
    clouds[c].x -= clouds[c].v*dt;
    if(clouds[c].x < -160){ clouds[c].x = W+120; clouds[c].y = 50+Math.random()*150; }
  }
  for(var f=floats.length-1;f>=0;f--){
    var fl = floats[f]; fl.life -= dt; fl.y += fl.vy*dt; fl.vy += 22*dt;
    if(fl.life<=0) floats.splice(f,1);
  }
  for(var b=bits.length-1;b>=0;b--){
    var p = bits[b];
    p.vy += 900*dt; p.x += p.vx*dt; p.y += p.vy*dt; p.rot += p.vr*dt;
    if(p.y > GROUND+6){ p.y = GROUND+6; p.vy *= -0.36; p.vx *= 0.7; p.vr *= 0.6; }
    p.life -= dt;
    if(p.life<=0) bits.splice(b,1);
  }
  if(wall.up && wall.rise < 1){
    wall.rise = Math.min(1, wall.rise + dt*9);
    if(wall.rise >= 1 && !wall.landed){   // dust kicked up where it hits the road
      wall.landed = true;
      shake = Math.max(shake, 14);
      noiseThud();
      for(var d=0;d<8;d++){
        bits.push({
          x: wall.x - 10 + Math.random()*60, y: GROUND - Math.random()*14,
          vx: (Math.random()-0.5)*160, vy: -40 - Math.random()*70,
          rot:0, vr:0, s: 10+Math.random()*14, life: 0.5+Math.random()*0.4, smoke:true
        });
      }
    }
  }

  if(state === ST.TITLE){
    car.x = CAR_X; car.v = 140; spin += 140*dt;
    return;
  }

  if(state === ST.ROUND_READY) return;

  if(state === ST.ENTER){
    // Standing start into round 1. Green: no points, but the run clock runs.
    runTime += dt;
    car.enter = Math.min(1, car.enter + dt*1.8);
    var e = 1 - Math.pow(1-car.enter,3);
    car.x = -190 + (CAR_X+190)*e;
    car.v = CRUISE*e;
    roll(car.v*dt);
    if(car.enter >= 1){ openYellow(); }
    return;
  }

  if(state === ST.GREEN){
    // Rolling up to this round's light. GREEN PAYS NOTHING — it is pure
    // dead weight on your average speed, which is what the bonus reads.
    runTime += dt;
    car.x = CAR_X;
    car.v = CRUISE * Math.min(1, st/0.55);
    roll(car.v*dt);
    if(st >= GREEN_TIME){ openYellow(); }
    return;
  }

  if(state === ST.MOVING){
    runTime += dt;
    car.x = CAR_X;
    // the car winds up for as long as yellow lasts, so late seconds pay most
    car.v = Math.min(MAX_SPEED, CRUISE + YELLOW_ACCEL*yellowTime);
    var moved = car.v*dt;
    roll(moved);
    scoredTravel += moved;               // only yellow pixels are worth points
    roundPoints += moved*PPX;
    score += moved*PPX;

    yellowTime += dt;
    if(yellowTime >= yellowLimit){ turnRed(); }
    return;
  }

  if(state === ST.RED){
    // Light is red and the wall is down. The world keeps scrolling, so the
    // wall closes on the bumper — no escape, just the last fraction of a second.
    car.x = CAR_X;
    var m2 = car.v*dt;
    roll(m2);
    wall.x -= m2;
    if(wall.x <= car.x + CAR_LEN - 4){ crash(); }
    return;
  }

  if(state === ST.BRAKING){
    // Braking from a wound-up car takes real seconds — all of it dead time
    // dragging your average speed down. Another cost of the standing restart.
    runTime += dt;
    car.visV = Math.max(0, car.visV - BRAKE_DECEL*dt);
    roll(car.visV*dt);
    if(car.visV <= 0){ passRound(); }
    return;
  }

  if(state === ST.RESOLVE_ROUND){
    if(st > 1.4) nextRound();
    return;
  }

  if(state === ST.RESOLVE_CRASH){
    car.squash = Math.max(0, car.squash - dt*0.9);
    car.tilt = Math.max(0, car.tilt - dt*0.5);
    if(st > 1.4){ state = ST.GAMEOVER; st = 0; }
    return;
  }

  if(state === ST.GAMEOVER){
    car.squash = Math.max(0, car.squash - dt*0.7);
    car.tilt = Math.max(0, car.tilt - dt*0.4);
    return;
  }
}

/* ================= draw helpers ================= */
function rr(x,y,w,h,r){
  var m=Math.min(w,h)/2; if(r>m) r=m;
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
}
function ink(w){ ctx.lineWidth=w||3; ctx.strokeStyle=C.ink; ctx.stroke(); }
function txt(s,x,y,size,col,align,ls,weight){
  ctx.save();
  ctx.font = (weight||900)+' '+size+'px "Trebuchet MS","Segoe UI",Verdana,sans-serif';
  if('letterSpacing' in ctx) ctx.letterSpacing = (ls==null?2:ls)+'px';
  ctx.textAlign = align||'left'; ctx.textBaseline='alphabetic';
  ctx.fillStyle = col; ctx.fillText(s,x,y);
  ctx.restore();
}
function txtShadow(s,x,y,size,col,align,ls){
  txt(s,x+3,y+3,size,'rgba(10,14,22,.4)',align,ls);
  txt(s,x,y,size,col,align,ls);
}

/* ================= scene ================= */
function drawSky(){
  var g = ctx.createLinearGradient(0,0,0,HORIZON);
  g.addColorStop(0,C.skyTop); g.addColorStop(1,C.skyBot);
  ctx.fillStyle=g; ctx.fillRect(0,0,W,HORIZON+2);
  ctx.fillStyle=C.sun; ctx.globalAlpha=.85;
  ctx.beginPath(); ctx.arc(816,80,40,0,6.2832); ctx.fill();
  ctx.globalAlpha=.25; ctx.beginPath(); ctx.arc(816,80,60,0,6.2832); ctx.fill();
  ctx.globalAlpha=1;
  ctx.fillStyle='rgba(255,255,255,.9)';
  for(var i=0;i<clouds.length;i++){
    var c=clouds[i], s=c.s;
    ctx.beginPath();
    ctx.arc(c.x,c.y,18*s,0,6.2832);
    ctx.arc(c.x+24*s,c.y-9*s,23*s,0,6.2832);
    ctx.arc(c.x+52*s,c.y,18*s,0,6.2832);
    ctx.rect(c.x,c.y-2,52*s,18*s);
    ctx.fill();
  }
}
function drawGround(){
  ctx.fillStyle=C.hill;
  ctx.beginPath();
  ctx.moveTo(0,HORIZON);
  ctx.quadraticCurveTo(150,HORIZON-40,300,HORIZON);
  ctx.quadraticCurveTo(470,HORIZON-50,660,HORIZON);
  ctx.quadraticCurveTo(830,HORIZON-36,960,HORIZON);
  ctx.lineTo(960,HORIZON+4); ctx.lineTo(0,HORIZON+4);
  ctx.closePath(); ctx.fill();

  ctx.fillStyle=C.grass; ctx.fillRect(0,HORIZON,W,ROAD_TOP-HORIZON);
  ctx.fillStyle=C.grassDark; ctx.fillRect(0,ROAD_TOP-7,W,7);

  ctx.fillStyle=C.roadTop; ctx.fillRect(0,ROAD_TOP,W,9);
  ctx.fillStyle=C.road; ctx.fillRect(0,ROAD_TOP+9,W,ROAD_BOT-ROAD_TOP-9);
  ctx.fillStyle=C.roadBot; ctx.fillRect(0,ROAD_BOT,W,14);

  var off = travel % 120;
  ctx.fillStyle=C.dash;
  for(var x=-130;x<W+130;x+=120) ctx.fillRect(x-off,450,60,6);

  ctx.fillStyle='#8E9AAC'; ctx.fillRect(0,ROAD_BOT+14,W,CONTROL_BAR_Y-(ROAD_BOT+14));
}

/* Distance ruler: driven by scoredTravel, the pixels covered while yellow is
   up, so it advances only when points are actually being earned and freezes
   the moment you brake. Its numbers are this round's distance points.    */
function drawRuler(){
  if(state===ST.TITLE) return;
  var y = ROAD_BOT + 30;
  var pxPerTick = 25 / PPX;              // px between each 25-point mark
  var off = scoredTravel % pxPerTick;
  var baseVal = Math.round((scoredTravel - off) * PPX);
  ctx.strokeStyle = C.rulerDim; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke();
  for(var x = -off, v = baseVal; x < W+40; x += pxPerTick, v += 25){
    ctx.strokeStyle = C.rulerDim;
    ctx.beginPath(); ctx.moveTo(x,y-9); ctx.lineTo(x,y+9); ctx.stroke();
    if(v >= 0) txt(String(v), x, y+26, 13, C.ruler, 'center', 1, 700);
  }
}

function drawControlBar(){
  ctx.fillStyle = 'rgba(11,16,26,.92)';
  ctx.fillRect(0, CONTROL_BAR_Y, W, H-CONTROL_BAR_Y);
  ctx.strokeStyle = 'rgba(255,255,255,.12)'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(0,CONTROL_BAR_Y); ctx.lineTo(W,CONTROL_BAR_Y); ctx.stroke();
}

/* The wall slams down out of frame the instant the light goes red: it is drawn
   at full size and translated in from above, so it reads as dropping. */
function drawWall(){
  if(!wall.up || wall.rise <= 0) return;
  var x = wall.x - 6;
  var h = 148;
  var e = wall.rise, ease = 1 - Math.pow(1-e,3);
  var y = GROUND+8-h, w = 40;

  ctx.save();
  ctx.translate(0, -(1-ease)*(GROUND+140));

  ctx.fillStyle='#D9714F';
  ctx.beginPath();
  ctx.moveTo(x,y); ctx.lineTo(x+16,y-12); ctx.lineTo(x+w+16,y-12); ctx.lineTo(x+w,y);
  ctx.closePath(); ctx.fill(); ink(3);

  ctx.fillStyle=C.brickDark;
  ctx.beginPath();
  ctx.moveTo(x+w,y); ctx.lineTo(x+w+16,y-12); ctx.lineTo(x+w+16,GROUND-4); ctx.lineTo(x+w,GROUND+8);
  ctx.closePath(); ctx.fill(); ink(3);

  ctx.fillStyle=C.brick; ctx.fillRect(x,y,w,h);
  ctx.save();
  ctx.beginPath(); ctx.rect(x,y,w,h); ctx.clip();
  ctx.strokeStyle=C.mortar; ctx.lineWidth=2.5;
  var row=0;
  for(var yy=GROUND+8; yy>y-20; yy-=17){
    ctx.beginPath(); ctx.moveTo(x,yy); ctx.lineTo(x+w,yy); ctx.stroke();
    var ox=(row%2===0)?w/2:0;
    ctx.beginPath(); ctx.moveTo(x+ox,yy); ctx.lineTo(x+ox,yy-17); ctx.stroke();
    row++;
  }
  ctx.restore();
  ctx.lineWidth=3.5; ctx.strokeStyle=C.ink; ctx.strokeRect(x,y,w,h);

  ctx.restore();
}

function drawWheel(wx,wy){
  var rot = spin/14;
  ctx.save(); ctx.translate(wx,wy);
  ctx.fillStyle='#20242D'; ctx.beginPath(); ctx.arc(0,0,15,0,6.2832); ctx.fill(); ink(3);
  ctx.rotate(rot);
  ctx.fillStyle='#E8EEF6'; ctx.beginPath(); ctx.arc(0,0,7.5,0,6.2832); ctx.fill();
  ctx.strokeStyle='#98A4B5'; ctx.lineWidth=2.5;
  for(var i=0;i<3;i++){
    var a=i*2.094;
    ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(Math.cos(a)*7,Math.sin(a)*7); ctx.stroke();
  }
  ctx.restore();
}

function drawCar(){
  var x=car.x, base=GROUND;
  ctx.save(); ctx.translate(x,base);
  if(car.squash > 0){
    ctx.translate(CAR_LEN*0.5,0);
    ctx.scale(1-0.16*car.squash, 1+0.10*car.squash);
    ctx.rotate(-0.10*car.tilt);
    ctx.translate(-CAR_LEN*0.5,0);
  }
  ctx.fillStyle='rgba(12,18,28,.28)';
  ctx.beginPath(); ctx.ellipse(CAR_LEN/2,6,74,10,0,0,6.2832); ctx.fill();

  drawWheel(30,-14); drawWheel(106,-14);

  ctx.fillStyle=C.car;
  ctx.beginPath();
  ctx.moveTo(30,-42); ctx.lineTo(48,-70); ctx.lineTo(96,-70); ctx.lineTo(112,-42);
  ctx.closePath(); ctx.fill(); ink(3.5);

  ctx.fillStyle=C.glass;
  ctx.beginPath();
  ctx.moveTo(44,-46); ctx.lineTo(56,-64); ctx.lineTo(76,-64); ctx.lineTo(76,-46);
  ctx.closePath(); ctx.fill(); ink(2.5);
  ctx.fillStyle=C.glass;
  ctx.beginPath();
  ctx.moveTo(82,-46); ctx.lineTo(82,-64); ctx.lineTo(92,-64); ctx.lineTo(104,-46);
  ctx.closePath(); ctx.fill(); ink(2.5);

  ctx.fillStyle=C.car; rr(0,-44,CAR_LEN,32,9); ctx.fill(); ink(3.5);
  ctx.fillStyle=C.carDark; rr(4,-22,CAR_LEN-8,9,4); ctx.fill();
  ctx.fillStyle=C.carLite; rr(10,-41,CAR_LEN-24,6,3); ctx.fill();

  ctx.fillStyle='#FFE96B'; rr(CAR_LEN-12,-38,12,10,3); ctx.fill(); ink(2.5);
  ctx.fillStyle='#FF9A3C'; rr(0,-38,10,10,3); ctx.fill(); ink(2.5);
  if((state===ST.BRAKING) && !car.dead){
    ctx.fillStyle='#FF3B3B'; rr(-1,-38,11,10,3); ctx.fill();
    ctx.globalAlpha=.4; ctx.fillStyle='#FF3B3B';
    ctx.beginPath(); ctx.arc(2,-33,16,0,6.2832); ctx.fill(); ctx.globalAlpha=1;
  }
  ctx.restore();

  if(state===ST.BRAKING && car.visV > 8){
    ctx.fillStyle='rgba(20,24,32,.28)';
    ctx.fillRect(x-70,base-4,70,6);
    ctx.fillRect(x+6,base-4,70,6);
  }
  if((state===ST.MOVING || state===ST.RED || state===ST.GREEN) && !car.dead){
    ctx.strokeStyle='rgba(255,255,255,.5)'; ctx.lineWidth=3;
    for(var i=0;i<3;i++){
      var yy = base-30-i*14;
      var len = 22 + ((spin*3 + i*40) % 26);
      ctx.beginPath(); ctx.moveTo(x-16-len,yy); ctx.lineTo(x-16,yy); ctx.stroke();
    }
  }
}

function drawBits(){
  for(var i=0;i<bits.length;i++){
    var p=bits[i];
    ctx.save(); ctx.translate(p.x,p.y);
    if(p.smoke){
      ctx.globalAlpha=Math.max(0,p.life*0.5);
      ctx.fillStyle='#C9CFD9';
      ctx.beginPath(); ctx.arc(0,0,p.s,0,6.2832); ctx.fill();
    } else {
      ctx.rotate(p.rot);
      ctx.globalAlpha=Math.min(1,p.life);
      ctx.fillStyle=C.brick; ctx.fillRect(-p.s/2,-p.s/3,p.s,p.s*0.66);
      ctx.lineWidth=2; ctx.strokeStyle=C.brickDark; ctx.strokeRect(-p.s/2,-p.s/3,p.s,p.s*0.66);
    }
    ctx.restore();
  }
  ctx.globalAlpha=1;
}

/* ================= HUD ================= */
function drawScoreboard(){
  // Run score — every point you are carrying, and all of it at risk (left)
  ctx.fillStyle='rgba(11,16,26,.68)'; rr(20,16,232,66,12); ctx.fill();
  ctx.lineWidth=2.5; ctx.strokeStyle='rgba(255,255,255,.14)'; ctx.stroke();
  txt('RUN SCORE — ALL AT RISK', 34, 38, 12, '#9FB6D2', 'left', 2.5);
  txtShadow(Math.round(shownScore)+' PTS', 34, 68, 26, runLost ? C.red : '#FFFFFF', 'left', 1);

  // Distance earned in the round you are driving right now (center-left)
  ctx.fillStyle='rgba(11,16,26,.68)'; rr(264,16,206,66,12); ctx.fill();
  ctx.lineWidth=2.5; ctx.strokeStyle='rgba(255,255,255,.14)'; ctx.stroke();
  txt('THIS ROUND', 278, 38, 12, '#9FB6D2', 'left', 2.5);
  var liveCol = (state===ST.RED) ? C.red : ((state===ST.MOVING) ? C.amber : '#9BE3FF');
  txtShadow(String(Math.round(roundPoints)), 278, 68, 26, liveCol, 'left', 1);
  if(state===ST.GREEN || state===ST.ENTER){
    txt('GREEN PAYS 0', 456, 38, 11, 'rgba(255,255,255,.45)', 'right', 1.5);
  }

  // Average speed across the run — this is what the end-of-run bonus pays on
  var bonus = runLost ? 0 : speedBonusNow();
  ctx.fillStyle='rgba(11,16,26,.68)'; rr(482,16,206,66,12); ctx.fill();
  ctx.lineWidth=2.5; ctx.strokeStyle='rgba(255,255,255,.14)'; ctx.stroke();
  txt('SPEED BONUS', 496, 38, 12, '#9FB6D2', 'left', 2.5);
  var bCol = bonus<=0 ? '#6C7C93' : (bonus < 300 ? '#FF8A6B' : C.gold);
  txtShadow(String(bonus), 496, 68, 26, bCol, 'left', 1);
  txt('AVG '+Math.round(avgSpeed()/4)+' MPH', 674, 38, 11, 'rgba(255,255,255,.55)', 'right', 1.5);
  var frac = Math.max(0, Math.min(1, bonus/1200));
  ctx.fillStyle='rgba(255,255,255,.10)'; rr(496,74,178,5,3); ctx.fill();
  if(frac>0){ ctx.fillStyle=bCol; rr(496,74,178*frac,5,3); ctx.fill(); }

  // Round counter + pips (right)
  txt('ROUND '+Math.min(round+1,TOTAL_ROUNDS)+' / '+TOTAL_ROUNDS, W-20, 30, 13, 'rgba(255,255,255,.75)', 'right', 2);
  var n=TOTAL_ROUNDS, pw=22, gap=5, totalW=n*pw+(n-1)*gap, sx=W-20-totalW;
  for(var i=0;i<n;i++){
    var col = results[i]==='clear' ? C.green : (runLost && i===round ? C.red : 'rgba(255,255,255,.30)');
    ctx.fillStyle=col; rr(sx+i*(pw+gap),40,pw,9,4); ctx.fill();
  }

  // fixed traffic-light HUD panel — a status indicator, not a roadside object
  var lx = W-84, ly = 58, lw = 62, lh = 118;
  ctx.fillStyle=C.boxB; rr(lx+6,ly+6,lw,lh,14); ctx.fill();
  ctx.fillStyle=C.boxA; rr(lx,ly,lw,lh,14); ctx.fill(); ink(3);
  var cx = lx+lw/2;
  var lamps = [
    {y:ly+26, on: light==='red',    col:C.red},
    {y:ly+62, on: light==='yellow', col:C.amber},
    {y:ly+98, on: light==='green',  col:C.green}
  ];
  for(var k=0;k<3;k++){
    var L=lamps[k];
    // red pulses hard, yellow breathes so its urgency reads without a timer
    var pulse = 1;
    if(L.on && light==='red')    pulse = 0.7+0.3*Math.abs(Math.sin(performance.now()/110));
    if(L.on && light==='yellow') pulse = 0.8+0.2*Math.abs(Math.sin(performance.now()/300));
    if(L.on){
      var g = ctx.createRadialGradient(cx,L.y,2,cx,L.y,34);
      g.addColorStop(0,L.col); g.addColorStop(1,'rgba(0,0,0,0)');
      ctx.globalAlpha=0.55*pulse; ctx.fillStyle=g;
      ctx.beginPath(); ctx.arc(cx,L.y,34,0,6.2832); ctx.fill(); ctx.globalAlpha=1;
    }
    ctx.fillStyle = L.on ? L.col : C.off;
    ctx.beginPath(); ctx.arc(cx,L.y,13,0,6.2832); ctx.fill();
    ctx.lineWidth=2.5; ctx.strokeStyle='rgba(0,0,0,.5)'; ctx.stroke();
    if(L.on){
      ctx.fillStyle='rgba(255,255,255,.75)';
      ctx.beginPath(); ctx.arc(cx-4,L.y-4,3.6,0,6.2832); ctx.fill();
    }
  }

  var word = light==='red' ? 'RED' : (light==='yellow' ? 'YELLOW' : 'GREEN');
  var wcol = light==='red' ? C.red : (light==='yellow' ? C.amber : C.green);
  txt(word, cx, ly+lh+20, 12, wcol, 'center', 2.5);
}

function drawFloats(){
  for(var i=0;i<floats.length;i++){
    var f=floats[i];
    ctx.globalAlpha = Math.min(1, f.life*1.6);
    txtShadow(f.txt, f.x, f.y, f.size, f.col, 'center', 2);
    ctx.globalAlpha = 1;
  }
}

function panel(x,y,w,h){
  ctx.fillStyle='rgba(11,16,26,.80)'; rr(x,y,w,h,16); ctx.fill();
  ctx.lineWidth=3; ctx.strokeStyle='rgba(255,255,255,.16)'; ctx.stroke();
}
function drawBtn(b,col,label,sub,dim){
  ctx.globalAlpha = dim ? 0.32 : 1;
  ctx.fillStyle='rgba(255,255,255,.07)'; rr(b.x,b.y,b.w,b.h,12); ctx.fill();
  ctx.lineWidth=3; ctx.strokeStyle=col; ctx.stroke();
  txt(label, b.x+b.w/2, b.y+b.h/2+(sub?-3:7), sub?19:20, col, 'center', 2.5);
  if(sub) txt(sub, b.x+b.w/2, b.y+b.h/2+17, 11, 'rgba(255,255,255,.6)', 'center', 1.5);
  ctx.globalAlpha = 1;
}

/* One lamp per round: five lights, five rounds, no second chances. */
function drawLightTrack(){
  var y = CONTROL_BAR_Y + 34, x0 = 34, r = 11, gap = 34;
  txt('LIGHTS', x0, y - 22, 12, '#7F91AC', 'left', 2.5);
  for(var i=0;i<TOTAL_ROUNDS;i++){
    var cx = x0 + r + i*gap, done = results[i]==='clear', live = (i === round);
    var col = done ? C.green
            : (live ? (light==='red'?C.red:(light==='yellow'?C.amber:C.green)) : C.off);
    if(live && light!=='off'){
      var g = ctx.createRadialGradient(cx,y,2,cx,y,22);
      g.addColorStop(0,col); g.addColorStop(1,'rgba(0,0,0,0)');
      ctx.globalAlpha=0.5; ctx.fillStyle=g;
      ctx.beginPath(); ctx.arc(cx,y,22,0,6.2832); ctx.fill(); ctx.globalAlpha=1;
    }
    ctx.fillStyle = col;
    ctx.beginPath(); ctx.arc(cx,y,r,0,6.2832); ctx.fill();
    ctx.lineWidth=2.5; ctx.strokeStyle='rgba(0,0,0,.55)'; ctx.stroke();
  }
  txt('ROUND '+Math.min(round+1,TOTAL_ROUNDS)+' OF '+TOTAL_ROUNDS,
      x0 + TOTAL_ROUNDS*gap + 12, y+5, 14, '#C9D8EC', 'left', 2);
}

function drawControls(){
  if(state === ST.ROUND_READY){
    drawBtn(BTN_BEGIN, C.green, 'BEGIN', 'SPACE');
  } else if(state === ST.MOVING || state === ST.BRAKING || state === ST.RED || state === ST.GREEN){
    drawBtn(BTN_STOP, C.red, 'STOP', 'SPACE', state !== ST.MOVING);
  }
  if(state !== ST.OVER && state !== ST.GAMEOVER) drawLightTrack();

  // live speed readout — the number that makes holding yellow feel worth it
  if(state===ST.MOVING || state===ST.RED || state===ST.BRAKING){
    var mph = Math.round((state===ST.BRAKING ? car.visV : car.v) / 4);
    txt('SPEED', W-34, CONTROL_BAR_Y+22, 12, '#7F91AC', 'right', 2.5);
    txt(mph+' MPH', W-34, CONTROL_BAR_Y+50, 22, state===ST.MOVING?C.amber:'#9BE3FF', 'right', 1);
  }
}

function drawOverlays(){
  if(state === ST.TITLE){
    ctx.fillStyle='rgba(8,12,20,.42)'; ctx.fillRect(0,0,W,H);
    panel(W/2-310,90,620,354);
    txtShadow('CHICKEN', W/2, 178, 66, C.amber, 'center', 9);
    txt('A RISK-TAKING DRIVING GAME', W/2, 208, 14, '#9FB6D2', 'center', 4);
    txt('FIVE ROUNDS, ONE LIGHT EACH. Yellow lasts an unknown time', W/2, 248, 17, '#E6EEF8', 'center', 0, 700);
    txt('and the car accelerates the whole way through it — the further', W/2, 272, 17, '#E6EEF8', 'center', 0, 700);
    txt('you get on yellow, the more you score. Green pays nothing.', W/2, 296, 17, '#E6EEF8', 'center', 0, 700);
    txt('STOP on yellow to clear the round. Reach RED and the wall', W/2, 320, 17, '#FFB4B4', 'center', 0, 700);
    txt('drops \u2014 every time \u2014 and the whole run is over.', W/2, 344, 17, '#FFB4B4', 'center', 0, 700);
    txt('Clear all five and a SPEED BONUS pays on your average speed.', W/2, 376, 15, '#FFD9A6', 'center', 0, 700);
    var pulse = 0.6+0.4*Math.abs(Math.sin(performance.now()/380));
    ctx.globalAlpha=pulse;
    txt('PRESS SPACE OR TAP TO START — 5 ROUNDS, NO RETRIES', W/2, 412, 18, C.green, 'center', 3);
    ctx.globalAlpha=1;
    return;
  }

  if(state === ST.ROUND_READY){
    txtShadow('ROUND '+(round+1), W/2, 168, 46, '#FFFFFF', 'center', 5);
    txt('ONE LIGHT  ·  STOP ON YELLOW  ·  RED ENDS THE RUN', W/2, 200, 15, '#B9CBE2', 'center', 3);
    return;
  }

  if(state === ST.ENTER){
    var a = Math.min(1, st*4);
    ctx.globalAlpha=a;
    txtShadow('ROUND '+(round+1), W/2, 168, 50, '#FFFFFF', 'center', 5);
    ctx.globalAlpha=1;
    return;
  }

  if(banner && state === ST.RESOLVE_ROUND){
    var t = st, al = Math.min(1, t*5) * (t>1.0 ? Math.max(0,(1.4-t)/0.4) : 1);
    ctx.globalAlpha=al;
    txtShadow(banner.big, W/2, 150, 46, banner.col, 'center', 5);
    txt(banner.sub, W/2, 184, 17, '#E9F1FA', 'center', 2);
    ctx.globalAlpha=1;
  }
  if(banner && state === ST.RESOLVE_CRASH){
    var t2 = st, al2 = Math.min(1, t2*5);
    ctx.globalAlpha=al2;
    txtShadow(banner.big, W/2, 150, 50, banner.col, 'center', 5);
    txt(banner.sub, W/2, 182, 16, '#E9F1FA', 'center', 2);
    ctx.globalAlpha=1;
  }

  if(state === ST.GAMEOVER){
    ctx.fillStyle='rgba(8,12,20,.56)'; ctx.fillRect(0,0,W,H);
    panel(W/2-300,140,600,286);
    txtShadow('GAME OVER', W/2, 214, 54, C.red, 'center', 5);
    txt('You held the yellow too long in round '+(round+1)+' of '+TOTAL_ROUNDS+'.', W/2, 252, 16, '#C4D5EA', 'center', 0, 700);
    txt('Every point is gone. The run starts again from round 1.', W/2, 276, 16, '#C4D5EA', 'center', 0, 700);
    txt('CLEARED '+results.length+' / '+TOTAL_ROUNDS+'   \u00B7   BEST RUN '+bestScore,
        W/2, 318, 16, '#8FA3BF', 'center', 2.5);
    var pg = 0.6+0.4*Math.abs(Math.sin(performance.now()/380));
    ctx.globalAlpha=pg;
    txt('PRESS SPACE OR TAP TO START OVER', W/2, 372, 19, C.green, 'center', 3);
    ctx.globalAlpha=1;
    txt('R  RESTART', W/2, 404, 12, 'rgba(255,255,255,.45)', 'center', 2.5);
    return;
  }

  if(state === ST.OVER){
    ctx.fillStyle='rgba(8,12,20,.5)'; ctx.fillRect(0,0,W,H);
    panel(W/2-300,96,600,368);
    txtShadow('ALL FIVE CLEARED', W/2, 164, 40, '#FFFFFF', 'center', 4);
    txt('FINAL SCORE', W/2, 202, 14, '#9FB6D2', 'center', 4);
    txtShadow(String(finalTotal), W/2, 266, 64, C.gold, 'center', 4);

    // the split, so the speed bonus reads as the payoff for pushing yellow
    txt('DISTANCE', W/2-150, 306, 13, '#9FB6D2', 'center', 2.5);
    txt(String(Math.round(score)), W/2-150, 336, 26, '#E6EEF8', 'center', 1);
    txt('+', W/2, 332, 24, '#6C7C93', 'center', 1);
    txt('SPEED BONUS', W/2+150, 306, 13, '#9FB6D2', 'center', 2.5);
    txt(String(finalBonus), W/2+150, 336, 26, C.gold, 'center', 1);

    txt('AVG '+Math.round(avgSpeed()/4)+' MPH OVER '+runTime.toFixed(1)+'S   \u00B7   BEST RUN '+bestScore,
        W/2, 372, 14, '#B9CBE2', 'center', 2);
    var p2 = 0.6+0.4*Math.abs(Math.sin(performance.now()/380));
    ctx.globalAlpha=p2;
    txt('PRESS SPACE OR TAP TO RUN AGAIN', W/2, 420, 18, C.green, 'center', 3);
    ctx.globalAlpha=1;
  }
}

/* ================= render ================= */
function draw(){
  ctx.save();
  if(shake > 0.4) ctx.translate((Math.random()-0.5)*shake, (Math.random()-0.5)*shake);
  drawSky();
  drawGround();
  drawRuler();
  if(state !== ST.TITLE){ drawWall(); drawCar(); drawBits(); }
  else drawCar();
  ctx.restore();

  if(flash > 0){
    ctx.fillStyle = 'rgba(255,90,90,'+(flash*0.42)+')';
    ctx.fillRect(0,0,W,H);
  }
  drawControlBar();
  if(state !== ST.TITLE){ drawScoreboard(); drawControls(); }
  drawFloats();
  drawOverlays();

  var v = ctx.createRadialGradient(W/2,H/2,H*0.42,W/2,H/2,H*0.95);
  v.addColorStop(0,'rgba(0,0,0,0)'); v.addColorStop(1,'rgba(6,10,18,.28)');
  ctx.fillStyle=v; ctx.fillRect(0,0,W,H);
}

/* ================= loop ================= */
car = {x:CAR_X, v:140, enter:1, dead:false, squash:0, tilt:0, visV:0};
light = 'off';
wall = {up:false, rise:0, x:0, landed:false};

var last = performance.now();
function loop(now){
  var dt = Math.min(0.05, (now-last)/1000);
  last = now;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

})();
</script>
</body>
</html>
