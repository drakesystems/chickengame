<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>CHICKEN — Risk-Taking Driving Game</title>
<style>
  :root{ --amber:#F5B942; }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    margin:0;
    background: radial-gradient(1100px 640px at 50% -8%, #2C2450 0%, #100C1E 65%);
    display:flex;align-items:center;justify-content:center;
    padding:16px;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
    overflow:hidden;
  }
  .frame{ width:100%;max-width:1000px; }
  .screen{
    position:relative;width:100%;aspect-ratio:960/650;border-radius:12px;overflow:hidden;
    background:#7DC3EC;
    box-shadow: 0 0 0 1px rgba(255,255,255,.06), 0 0 0 5px #17132A, 0 20px 48px rgba(0,0,0,.55);
  }
  canvas{display:block;width:100%;height:100%}
  .hint{
    margin:12px 2px 0;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;
    color:#8D84A8;font-size:12px;letter-spacing:.08em;text-transform:uppercase;
  }
  .hint b{color:#E4DFF2;font-weight:700}
  .key{
    display:inline-block;padding:3px 9px;border-radius:5px;
    background:#211A3A;border:1px solid #3E3564;
    color:#E4DFF2;font-size:11px;letter-spacing:.06em;
  }
  button.mute{
    background:#211A3A;border:1px solid #3E3564;color:#8D84A8;
    border-radius:5px;padding:5px 10px;font:inherit;font-size:11px;
    letter-spacing:.08em;cursor:pointer;text-transform:uppercase;
  }
  button.mute:hover{color:#E4DFF2;border-color:#5A4C8C}
  button.mute:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
  @media (max-width:560px){ .hint{font-size:10px} }
</style>
</head>
<body>
<div class="frame">
  <div class="screen"><canvas id="game" aria-label="Chicken driving game"></canvas></div>
  <div class="hint">
    <span>
      <span class="key">Space</span> <b>Go / Stop</b> &nbsp;·&nbsp;
      <span class="key">B</span> <b>Bank points</b> &nbsp;·&nbsp;
      <b>1 practice + 5 trials</b> &nbsp;·&nbsp;
      <span class="key">R</span> <b>Restart</b>
    </span>
    <span style="display:flex;gap:8px">
      <button class="mute" id="csv" type="button">Download CSV</button>
      <button class="mute" id="restart" type="button">Restart</button>
      <button class="mute" id="mute" type="button">Sound: On</button>
    </span>
  </div>
</div>

<script>
(function(){
"use strict";

/* ================= setup ================= */
var cvs = document.getElementById('game');
var ctx = cvs.getContext('2d');
var W = 960, H = 650;
function resize(){
  var dpr = Math.min(window.devicePixelRatio || 1, 2);
  cvs.width = Math.round(W*dpr); cvs.height = Math.round(H*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
resize();
window.addEventListener('resize', resize);

/* ================= palette ================= */
var C = {
  skyTop:'#3E93D8', skyMid:'#7DC3EC', skyBot:'#DFF3F7', sun:'#FFF6D8',
  hill:'#5E9A82', grass:'#5FBF6D', grassDark:'#3F9E52',
  road:'#4A4E58', roadTop:'#63676F', roadBot:'#2E3138', dash:'#F5F5F0',
  car:'#F0523B', carDark:'#B8331F', carLite:'#F58A6E', glass:'#6FA8D8',
  glassLite:'#D9EEFA',
  ink:'#1C1730', boxA:'#3A3468', boxB:'#221C3E',
  green:'#3FCB80', amber:'#F5B942', red:'#F0473F', off:'#332C4C',
  brick:'#D9714F', brickDark:'#9E4A31', mortar:'#F0DCC4', gold:'#FFCB4E',
  ruler:'#F5ECD9', rulerDim:'rgba(255,255,255,.35)'
};

/* ================= audio ================= */
var AC = null, soundOn = true;
var muteBtn = document.getElementById('mute');
muteBtn.addEventListener('click', function(){
  soundOn = !soundOn;
  muteBtn.textContent = 'Sound: ' + (soundOn ? 'On' : 'Off');
  muteBtn.blur();
});
function beep(freq, dur, type, vol){
  if(!soundOn) return;
  try{
    if(!AC) AC = new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state === 'suspended') AC.resume();
    var o = AC.createOscillator(), g = AC.createGain();
    o.type = type||'square'; o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, AC.currentTime);
    g.gain.exponentialRampToValueAtTime(vol||0.06, AC.currentTime+0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, AC.currentTime+dur);
    o.connect(g); g.connect(AC.destination);
    o.start(); o.stop(AC.currentTime+dur+0.02);
  }catch(e){}
}
function noiseThud(){
  if(!soundOn) return;
  try{
    if(!AC) AC = new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state === 'suspended') AC.resume();
    var len = Math.floor(AC.sampleRate*0.45);
    var buf = AC.createBuffer(1, len, AC.sampleRate);
    var d = buf.getChannelData(0);
    for(var i=0;i<len;i++){ d[i] = (Math.random()*2-1) * Math.pow(1-i/len, 2.4); }
    var s = AC.createBufferSource(); s.buffer = buf;
    var f = AC.createBiquadFilter(); f.type='lowpass'; f.frequency.value=900;
    var g = AC.createGain(); g.gain.value = 0.32;
    s.connect(f); f.connect(g); g.connect(AC.destination);
    s.start();
  }catch(e){}
}

/* ================= geometry ================= */
var HORIZON = 320, ROAD_TOP = 372, ROAD_BOT = 462, GROUND = 440;
var CONTROL_BAR_Y = 552;   // everything below this is the dashboard, not the road scene
var CAR_X = 210, CAR_LEN = 128;
var CRUISE = 210;          // px/s visual speed while moving (no speed control — on/off only)
var EASE_RATE = 6;         // exponential ease for the visual glide between moving/stopped

/* ================= scoring & timing =================
   Points tick up on a fixed clock while the car is MOVING — that is the only
   control the player has. Stopping earns nothing more but is always safe;
   moving is worth more but risks the wall. Every trial re-rolls its own
   green->yellow and yellow->red delays so the pattern can never be learned. */
var POINT_STEP = 25, POINT_INTERVAL = 0.4;      // +25 pts every 0.4s of motion
var YELLOW_MIN = 1, YELLOW_MAX = 4;              // seconds: trial start -> yellow
var RED_MIN = 1, RED_MAX = 4;                    // seconds: yellow -> red/wall
var TOTAL_TRIALS = 5;
var PX_PER_TICK = CRUISE * POINT_INTERVAL;       // road scroll per point tick, for the ruler

function randRange(a,b){ return a + Math.random()*(b-a); }

/* ================= state ================= */
var ST = {
  TITLE:0, PRACTICE_INTRO:1, PRACTICE_DONE:2, TRIAL_INTRO:3,
  ACTIVE:4, RESOLVE:5, SUMMARY:6
};
var state = ST.TITLE, st = 0;

var bankAccount = 0, crashCount = 0, trialIndex = 0;
var trialLog = [];             // one row per real (non-practice) trial
var bestBank = 0;

var trial = null;              // the trial currently running or just resolved
var car, wall;
var travel = 0, spin = 0, shake = 0, flash = 0, banner = null;
var bits = [], floats = [], clouds = [];

for(var ci=0; ci<5; ci++){
  clouds.push({x: Math.random()*W, y: 60+Math.random()*140, s: 0.7+Math.random()*0.9, v: 6+Math.random()*10});
}

car = {x:CAR_X, visV:CRUISE, dead:false, squash:0, tilt:0};
wall = {up:false, rise:0, x:0, landed:false};

function curLight(){ return trial ? trial.light : 'off'; }

/* ================= trial lifecycle ================= */
function newTrial(isPractice){
  var yellowAt = randRange(YELLOW_MIN, YELLOW_MAX);
  var redAt = yellowAt + randRange(RED_MIN, RED_MAX);
  trial = {
    isPractice: isPractice,
    number: isPractice ? 0 : trialIndex+1,
    yellowAt: yellowAt, redAt: redAt,
    elapsed: 0,
    light: 'green',
    moving: true,               // the car starts moving automatically
    restarts: 0,
    pointsThisRound: 0,
    pointAccum: 0,
    yellowTotalTime: 0,
    yellowMotionTime: 0,
    outcome: null,
    finalPoints: 0,
    lostPoints: 0
  };
  car = {x:CAR_X, visV:0, dead:false, squash:0, tilt:0};
  wall = {up:false, rise:0, x:0, landed:false};
  travel = 0; banner = null;
}

function startGame(){
  bankAccount = 0; crashCount = 0; trialIndex = 0; trialLog = [];
  state = ST.PRACTICE_INTRO; st = 0;
  beep(660,0.09,'square',0.05);
}

function beginPracticeTrial(){
  newTrial(true);
  state = ST.ACTIVE; st = 0;
  beep(660,0.08,'square',0.05);
}

function beginNextTrial(){
  newTrial(false);
  state = ST.ACTIVE; st = 0;
}

function toggleGoStop(){
  if(state !== ST.ACTIVE || trial.outcome) return;
  if(trial.moving){
    trial.moving = false;
    beep(260,0.12,'sawtooth',0.05);
  } else {
    trial.moving = true;
    trial.restarts++;
    beep(660,0.08,'square',0.05);
  }
}

function pressBank(){
  if(state !== ST.ACTIVE || trial.outcome || trial.moving) return;
  bankTrial();
}

function triggerRed(){
  trial.light = 'red';
  wall.x = car.x + CAR_LEN + 40;
  wall.up = true; wall.rise = 0; wall.landed = false;
  shake = Math.max(shake, 10);
  beep(180,0.20,'sawtooth',0.08);
  if(trial.moving){ crashTrial(); } else { bankTrial(); }
}

function crashTrial(){
  trial.outcome = 'crash';
  trial.lostPoints = Math.round(trial.pointsThisRound);
  trial.pointsThisRound = 0;
  car.dead = true; car.visV = 0; car.squash = 1; car.tilt = 0.9;
  shake = 12; flash = 1;
  noiseThud(); beep(120,0.35,'sawtooth',0.10);
  banner = {big:'CRASH!', sub:'LOST '+trial.lostPoints+' POINTS THIS TRIAL', col:C.red};
  floats.push({x:car.x+CAR_LEN-30, y:GROUND-118, txt:'-'+trial.lostPoints, col:'#C9847E', life:1.3, vy:-34, size:28});
  spawnDebris(wall.x, true);
  finalizeTrial();
  state = ST.RESOLVE; st = 0;
}

function bankTrial(){
  trial.outcome = 'bank';
  trial.finalPoints = Math.round(trial.pointsThisRound);
  if(!trial.isPractice) bankAccount += trial.finalPoints;
  banner = {big: trial.isPractice ? 'PRACTICE BANKED' : 'BANKED!', sub:'+'+trial.finalPoints+' POINTS SAVED', col:C.green};
  floats.push({x:car.x+CAR_LEN-20, y:GROUND-108, txt:'+'+trial.finalPoints, col:C.gold, life:1.0, vy:-40, size:26});
  beep(880,0.09,'square',0.055);
  setTimeout(function(){ beep(1180,0.11,'square',0.05); }, 85);
  finalizeTrial();
  state = ST.RESOLVE; st = 0;
}

function finalizeTrial(){
  var pct = trial.yellowTotalTime > 0
    ? Math.round((trial.yellowMotionTime/trial.yellowTotalTime)*1000)/10
    : null;
  trial.pctMovingAfterYellow = pct;
  if(!trial.isPractice){
    trialIndex++;
    if(trial.outcome === 'crash') crashCount++;
    trialLog.push({
      trial: trial.number,
      outcome: trial.outcome,
      pointsBanked: trial.finalPoints,
      pointsLost: trial.lostPoints,
      restarts: trial.restarts,
      yellowDelaySec: Math.round(trial.yellowAt*100)/100,
      redDelaySec: Math.round((trial.redAt-trial.yellowAt)*100)/100,
      pctMovingAfterYellow: pct
    });
    bestBank = Math.max(bestBank, bankAccount);
  }
}

function advanceAfterResolve(){
  if(trial.isPractice){ state = ST.PRACTICE_DONE; st = 0; }
  else if(trialIndex >= TOTAL_TRIALS){ state = ST.SUMMARY; st = 0; }
  else { state = ST.TRIAL_INTRO; st = 0; trial = null; }
}

function resetAll(){
  bankAccount = 0; crashCount = 0; trialIndex = 0; trialLog = [];
  trial = null;
  car = {x:CAR_X, visV:CRUISE, dead:false, squash:0, tilt:0};
  wall = {up:false, rise:0, x:0, landed:false};
  travel = 0; banner = null; bits = [];
  state = ST.TITLE; st = 0;
}

/* ================= CSV export ================= */
function exportCSV(){
  if(trialLog.length === 0) return;
  var header = ['trial','outcome','points_banked','points_lost','restarts','yellow_delay_sec','red_delay_sec','pct_time_moving_after_yellow'];
  var rows = trialLog.map(function(r){
    return [r.trial, r.outcome, r.pointsBanked, r.pointsLost, r.restarts,
            r.yellowDelaySec, r.redDelaySec, r.pctMovingAfterYellow==null?'':r.pctMovingAfterYellow].join(',');
  });
  var csv = header.join(',') + '\n' + rows.join('\n') + '\n';
  var blob = new Blob([csv], {type:'text/csv'});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url; a.download = 'chicken-game-results.csv';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
document.getElementById('csv').addEventListener('click', function(){ exportCSV(); this.blur(); });

/* ================= input ================= */
var BTN_STOP = {x: W/2-110, y: 578, w: 220, h: 56};
var BTN_GO   = {x: W/2-220, y: 578, w: 190, h: 56};
var BTN_BANK = {x: W/2+30,  y: 578, w: 190, h: 56};
var BTN_BEGIN = {x: W/2-110, y: 578, w: 220, h: 56};

function hit(b, mx, my){ return mx>=b.x && mx<=b.x+b.w && my>=b.y && my<=b.y+b.h; }

window.addEventListener('keydown', function(e){
  if(e.code === 'Space' || e.code === 'Enter'){
    e.preventDefault();
    if(state===ST.TITLE){ startGame(); }
    else if(state===ST.PRACTICE_INTRO){ beginPracticeTrial(); }
    else if(state===ST.PRACTICE_DONE){ state=ST.TRIAL_INTRO; st=0; trial=null; }
    else if(state===ST.SUMMARY){ startGame(); }
    else if(state===ST.ACTIVE){ toggleGoStop(); }
    return;
  }
  var k = e.key ? e.key.toLowerCase() : '';
  if(k === 'b'){ e.preventDefault(); pressBank(); }
  if(k === 'r'){ e.preventDefault(); beep(500,0.09,'square',0.05); resetAll(); }
});

cvs.addEventListener('pointerdown', function(e){
  e.preventDefault();
  var r = cvs.getBoundingClientRect();
  var mx = (e.clientX - r.left) * (W/r.width);
  var my = (e.clientY - r.top) * (H/r.height);

  if(state===ST.TITLE){ startGame(); return; }
  if(state===ST.PRACTICE_INTRO && hit(BTN_BEGIN, mx, my)){ beginPracticeTrial(); return; }
  if(state===ST.PRACTICE_DONE && hit(BTN_BEGIN, mx, my)){ state=ST.TRIAL_INTRO; st=0; trial=null; return; }
  if(state===ST.SUMMARY){ startGame(); return; }
  if(state===ST.ACTIVE){
    if(trial.moving){ if(hit(BTN_STOP, mx, my)) toggleGoStop(); }
    else {
      if(hit(BTN_GO, mx, my)) toggleGoStop();
      else if(hit(BTN_BANK, mx, my)) pressBank();
    }
  }
});

document.getElementById('restart').addEventListener('click', function(){
  beep(500,0.09,'square',0.05); resetAll(); this.blur();
});

/* ================= debris ================= */
function spawnDebris(atX, big){
  var n = big ? 18 : 8;
  for(var i=0;i<n;i++){
    bits.push({
      x: atX + Math.random()*26, y: GROUND - Math.random()*100,
      vx: 50 + Math.random()*160, vy: -100 - Math.random()*160,
      rot: Math.random()*6, vr: (Math.random()-0.5)*10,
      s: 8 + Math.random()*8, life: 1.0 + Math.random()*0.4, smoke:false,
      spark: Math.random()<0.35
    });
  }
  if(big){
    for(var j=0;j<5;j++){
      bits.push({
        x: atX - 20 + Math.random()*30, y: GROUND - 40 - Math.random()*50,
        vx: -30 - Math.random()*60, vy: -50 - Math.random()*80,
        rot:0, vr:0, s: 14+Math.random()*14, life: 0.7+Math.random()*0.4, smoke:true
      });
    }
  }
}

/* ================= update ================= */
function roll(px){ travel += px; spin += px; }

function update(dt){
  st += dt;
  shake = Math.max(0, shake - dt*46);
  flash = Math.max(0, flash - dt*2.6);

  for(var c=0;c<clouds.length;c++){
    clouds[c].x -= clouds[c].v*dt;
    if(clouds[c].x < -160){ clouds[c].x = W+120; clouds[c].y = 50+Math.random()*150; }
  }
  for(var f=floats.length-1;f>=0;f--){
    var fl = floats[f]; fl.life -= dt; fl.y += fl.vy*dt; fl.vy += 22*dt;
    if(fl.life<=0) floats.splice(f,1);
  }
  for(var b=bits.length-1;b>=0;b--){
    var p = bits[b];
    p.vy += 900*dt; p.x += p.vx*dt; p.y += p.vy*dt; p.rot += p.vr*dt;
    if(p.y > GROUND+6){ p.y = GROUND+6; p.vy *= -0.36; p.vx *= 0.7; p.vr *= 0.6; }
    p.life -= dt;
    if(p.life<=0) bits.splice(b,1);
  }
  if(wall.up && wall.rise < 1){
    wall.rise = Math.min(1, wall.rise + dt*9);
    if(wall.rise >= 1 && !wall.landed){
      wall.landed = true;
      shake = Math.max(shake, 14);
      noiseThud();
      for(var d=0;d<8;d++){
        bits.push({
          x: wall.x - 10 + Math.random()*60, y: GROUND - Math.random()*14,
          vx: (Math.random()-0.5)*160, vy: -40 - Math.random()*70,
          rot:0, vr:0, s: 10+Math.random()*14, life: 0.5+Math.random()*0.4, smoke:true
        });
      }
    }
  }

  if(state === ST.TITLE){
    car.x = CAR_X; car.visV = CRUISE; roll(CRUISE*dt);
    return;
  }

  if(state === ST.PRACTICE_INTRO || state === ST.PRACTICE_DONE || state === ST.SUMMARY){
    return;
  }

  if(state === ST.TRIAL_INTRO){
    if(st > 0.9){
      if(trialIndex >= TOTAL_TRIALS){ state = ST.SUMMARY; st = 0; }
      else beginNextTrial();
    }
    return;
  }

  if(state === ST.ACTIVE){
    trial.elapsed += dt;

    if(trial.moving){
      trial.pointAccum += dt;
      while(trial.pointAccum >= POINT_INTERVAL){
        trial.pointAccum -= POINT_INTERVAL;
        trial.pointsThisRound += POINT_STEP;
      }
    }

    if(trial.light === 'green' && trial.elapsed >= trial.yellowAt){
      trial.light = 'yellow';
      beep(520,0.08,'square',0.05);
    }
    if(trial.light === 'yellow'){
      trial.yellowTotalTime += dt;
      if(trial.moving) trial.yellowMotionTime += dt;
      if(trial.elapsed >= trial.redAt){ triggerRed(); }
    }

    car.x = CAR_X;
    var target = trial.moving ? CRUISE : 0;
    car.visV += (target - car.visV) * Math.min(1, dt*EASE_RATE);
    if(Math.abs(car.visV-target) < 0.5) car.visV = target;
    roll(car.visV*dt);
    return;
  }

  if(state === ST.RESOLVE){
    if(trial.outcome === 'crash'){
      car.squash = Math.max(0, car.squash - dt*0.8);
      car.tilt = Math.max(0, car.tilt - dt*0.45);
    }
    if(st > (trial.outcome === 'crash' ? 1.4 : 1.1)){ advanceAfterResolve(); }
    return;
  }
}

/* ================= draw helpers ================= */
function rr(x,y,w,h,r){
  var m=Math.min(w,h)/2; if(r>m) r=m;
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
}
function ink(w){ ctx.lineWidth=w||1.5; ctx.strokeStyle=C.ink; ctx.stroke(); }
var FONT = '-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif';
function txt(s,x,y,size,col,align,ls,weight){
  ctx.save();
  ctx.font = (weight||700)+' '+size+'px '+FONT;
  if('letterSpacing' in ctx) ctx.letterSpacing = (ls==null?0.5:ls)+'px';
  ctx.textAlign = align||'left'; ctx.textBaseline='alphabetic';
  ctx.fillStyle = col; ctx.fillText(s,x,y);
  ctx.restore();
}
/* Soft, single-pass shadow (blur, not an offset double-draw) for headline
   moments only — titles, banners, big numbers. Keeps everyday labels flat. */
function txtShadow(s,x,y,size,col,align,ls){
  ctx.save();
  ctx.shadowColor = 'rgba(10,6,24,.5)';
  ctx.shadowBlur = size*0.28;
  ctx.shadowOffsetY = size*0.06;
  txt(s,x,y,size,col,align,ls);
  ctx.restore();
}

/* ================= scene ================= */
function drawSky(){
  var g = ctx.createLinearGradient(0,0,0,HORIZON);
  g.addColorStop(0,C.skyTop); g.addColorStop(0.55,C.skyMid); g.addColorStop(1,C.skyBot);
  ctx.fillStyle=g; ctx.fillRect(0,0,W,HORIZON+2);

  var sun = ctx.createRadialGradient(770,70,4,770,70,140);
  sun.addColorStop(0,'rgba(255,252,232,.95)');
  sun.addColorStop(0.4,'rgba(255,246,216,.4)');
  sun.addColorStop(1,'rgba(255,246,216,0)');
  ctx.fillStyle=sun; ctx.fillRect(0,0,W,HORIZON+2);

  ctx.fillStyle='rgba(255,255,255,.9)';
  for(var i=0;i<clouds.length;i++){
    var c=clouds[i], s=c.s;
    ctx.globalAlpha=0.85;
    ctx.beginPath();
    ctx.arc(c.x,c.y,15*s,0,6.2832);
    ctx.arc(c.x+18*s,c.y-7*s,18*s,0,6.2832);
    ctx.arc(c.x+40*s,c.y,15*s,0,6.2832);
    rr(c.x,c.y-1,40*s,15*s,7*s);
    ctx.fill();
  }
  ctx.globalAlpha=1;
}
function drawGround(){
  ctx.fillStyle=C.hill;
  ctx.fillRect(0,HORIZON-6,W,10);

  var gg = ctx.createLinearGradient(0,HORIZON,0,ROAD_TOP);
  gg.addColorStop(0,C.grass); gg.addColorStop(1,C.grassDark);
  ctx.fillStyle=gg; ctx.fillRect(0,HORIZON,W,ROAD_TOP-HORIZON);

  var rg = ctx.createLinearGradient(0,ROAD_TOP,0,ROAD_BOT);
  rg.addColorStop(0,C.roadTop); rg.addColorStop(0.35,C.road); rg.addColorStop(1,C.roadBot);
  ctx.fillStyle=rg; ctx.fillRect(0,ROAD_TOP,W,ROAD_BOT-ROAD_TOP);

  var off = travel % 120;
  ctx.fillStyle=C.dash; ctx.globalAlpha=0.85;
  for(var x=-130;x<W+130;x+=120) ctx.fillRect(x-off,450,60,6);
  ctx.globalAlpha=1;

  var bg = ctx.createLinearGradient(0,ROAD_BOT,0,CONTROL_BAR_Y);
  bg.addColorStop(0,'#8C9199'); bg.addColorStop(1,'#6E737B');
  ctx.fillStyle=bg; ctx.fillRect(0,ROAD_BOT,W,CONTROL_BAR_Y-ROAD_BOT);
}

/* Distance ruler: markers tick up 25, 50, 75, 100... in step with the points
   counter, since both are driven by the same moving flag and clock.        */
function drawRuler(){
  if(!trial) return;
  var y = ROAD_BOT + 30;
  var pxPerTick = PX_PER_TICK;
  var off = travel % pxPerTick;
  var baseVal = Math.round((travel-off)/pxPerTick) * POINT_STEP;
  ctx.strokeStyle = C.rulerDim; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke();
  for(var x = -off, v = baseVal; x < W+40; x += pxPerTick, v += POINT_STEP){
    ctx.strokeStyle = C.rulerDim;
    ctx.beginPath(); ctx.moveTo(x,y-9); ctx.lineTo(x,y+9); ctx.stroke();
    if(v >= 0) txt(String(v), x, y+26, 13, C.ruler, 'center', 1, 700);
  }
}

function drawControlBar(){
  var bg = ctx.createLinearGradient(0,CONTROL_BAR_Y,0,H);
  bg.addColorStop(0,'#1C1734'); bg.addColorStop(1,'#130F26');
  ctx.fillStyle = bg;
  ctx.fillRect(0, CONTROL_BAR_Y, W, H-CONTROL_BAR_Y);
  ctx.strokeStyle = 'rgba(255,255,255,.10)'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(0,CONTROL_BAR_Y); ctx.lineTo(W,CONTROL_BAR_Y); ctx.stroke();
}

function drawWall(){
  if(!wall.up || wall.rise <= 0) return;
  var x = wall.x - 6;
  var h = 148;
  var e = wall.rise, ease = 1 - Math.pow(1-e,3);
  var y = GROUND+8-h, w = 40;

  ctx.save();
  ctx.translate(0, -(1-ease)*(GROUND+140));
  ctx.shadowColor='rgba(10,6,24,.4)'; ctx.shadowBlur=14; ctx.shadowOffsetY=6;

  var wg = ctx.createLinearGradient(x,0,x+w,0);
  wg.addColorStop(0,C.brick); wg.addColorStop(0.7,C.brick); wg.addColorStop(1,C.brickDark);
  ctx.fillStyle=wg; ctx.fillRect(x,y,w,h);
  ctx.shadowColor='transparent';

  ctx.save();
  ctx.beginPath(); ctx.rect(x,y,w,h); ctx.clip();
  ctx.strokeStyle=C.mortar; ctx.lineWidth=1.5; ctx.globalAlpha=0.55;
  for(var yy=GROUND+8; yy>y-20; yy-=17){
    ctx.beginPath(); ctx.moveTo(x,yy); ctx.lineTo(x+w,yy); ctx.stroke();
  }
  ctx.globalAlpha=1;
  ctx.restore();
  ctx.lineWidth=2; ctx.strokeStyle=C.brickDark; ctx.strokeRect(x,y,w,h);

  ctx.restore();
}

function drawWheel(wx,wy){
  ctx.save(); ctx.translate(wx,wy);
  ctx.fillStyle='#18161F'; ctx.beginPath(); ctx.arc(0,0,15,0,6.2832); ctx.fill(); ink(1.5);
  ctx.fillStyle='rgba(255,255,255,.10)';
  ctx.beginPath(); ctx.arc(-4,-4,8,0,6.2832); ctx.fill();
  ctx.fillStyle='#5A5F72'; ctx.beginPath(); ctx.arc(0,0,5,0,6.2832); ctx.fill();
  ctx.restore();
}

function drawCar(){
  var x=car.x, base=GROUND;
  ctx.save(); ctx.translate(x,base);
  if(car.squash > 0){
    ctx.translate(CAR_LEN*0.5,0);
    ctx.scale(1-0.05*car.squash, 1);
    ctx.rotate(-0.03*car.tilt);
    ctx.translate(-CAR_LEN*0.5,0);
  }
  ctx.fillStyle='rgba(10,6,20,.30)';
  ctx.beginPath(); ctx.ellipse(CAR_LEN/2,7,76,10,0,0,6.2832); ctx.fill();

  drawWheel(30,-14); drawWheel(106,-14);

  var bodyG = ctx.createLinearGradient(0,-70,0,-20);
  bodyG.addColorStop(0,C.carLite); bodyG.addColorStop(0.45,C.car); bodyG.addColorStop(1,C.carDark);

  ctx.fillStyle=bodyG;
  ctx.beginPath();
  ctx.moveTo(30,-42); ctx.lineTo(48,-70); ctx.lineTo(96,-70); ctx.lineTo(112,-42);
  ctx.closePath(); ctx.fill(); ink(1.5);

  var glassG = ctx.createLinearGradient(44,-64,104,-46);
  glassG.addColorStop(0,C.glassLite); glassG.addColorStop(0.5,C.glass); glassG.addColorStop(1,C.glass);
  ctx.fillStyle=glassG;
  ctx.beginPath();
  ctx.moveTo(44,-46); ctx.lineTo(56,-64); ctx.lineTo(76,-64); ctx.lineTo(76,-46);
  ctx.closePath(); ctx.fill();
  ctx.beginPath();
  ctx.moveTo(82,-46); ctx.lineTo(82,-64); ctx.lineTo(92,-64); ctx.lineTo(104,-46);
  ctx.closePath(); ctx.fill();

  ctx.fillStyle=bodyG; rr(0,-44,CAR_LEN,32,7); ctx.fill(); ink(1.5);
  ctx.fillStyle=C.carDark; ctx.globalAlpha=0.5; rr(4,-22,CAR_LEN-8,8,3); ctx.fill(); ctx.globalAlpha=1;
  ctx.fillStyle='rgba(255,255,255,.22)'; rr(8,-41,CAR_LEN-24,4,2); ctx.fill();

  var stopped = trial && !trial.moving && state===ST.ACTIVE && !car.dead;
  ctx.fillStyle = stopped ? C.red : '#DDBE4E';
  rr(-1,-38,10,9,2); ctx.fill();
  ctx.fillStyle='#F0DCC4'; rr(CAR_LEN-11,-38,12,9,2); ctx.fill();
  ctx.restore();

  if(stopped && car.visV > 8){
    ctx.fillStyle='rgba(10,6,20,.22)';
    ctx.fillRect(x-70,base-4,70,5);
    ctx.fillRect(x+6,base-4,70,5);
  }
}

function drawBits(){
  for(var i=0;i<bits.length;i++){
    var p=bits[i];
    ctx.save(); ctx.translate(p.x,p.y);
    if(p.smoke){
      ctx.globalAlpha=Math.max(0,p.life*0.4);
      ctx.fillStyle='#E8E4DC';
      ctx.beginPath(); ctx.arc(0,0,p.s,0,6.2832); ctx.fill();
    } else {
      ctx.rotate(p.rot);
      ctx.globalAlpha=Math.min(1,p.life);
      ctx.fillStyle=p.spark?C.gold:C.brick; ctx.fillRect(-p.s/2,-p.s/3,p.s,p.s*0.66);
      ctx.lineWidth=1; ctx.strokeStyle=p.spark?C.brickDark:C.brickDark; ctx.strokeRect(-p.s/2,-p.s/3,p.s,p.s*0.66);
    }
    ctx.restore();
  }
  ctx.globalAlpha=1;
}

/* ================= HUD ================= */
function hudCard(x,y,w,h){
  ctx.save();
  ctx.shadowColor='rgba(0,0,0,.35)'; ctx.shadowBlur=10; ctx.shadowOffsetY=3;
  ctx.fillStyle='rgba(20,15,40,.72)'; rr(x,y,w,h,10); ctx.fill();
  ctx.restore();
  ctx.lineWidth=1.5; ctx.strokeStyle='rgba(255,255,255,.14)'; ctx.stroke();
  ctx.strokeStyle='rgba(255,255,255,.18)'; ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(x+10,y+1.5); ctx.lineTo(x+w-10,y+1.5); ctx.stroke();
}

function drawScoreboard(){
  var pts = trial ? Math.round(trial.pointsThisRound) : 0;

  // Bank Account — points already banked, safe forever
  hudCard(20,16,232,66);
  txt('BANK ACCOUNT', 34, 38, 12, '#B6A8DC', 'left', 1.5);
  txtShadow(bankAccount+' PTS', 34, 68, 26, C.gold, 'left', 0.5);

  // Points This Round — live, all at risk until banked
  hudCard(264,16,206,66);
  txt('POINTS THIS ROUND', 278, 38, 12, '#B6A8DC', 'left', 1.5);
  var light = curLight();
  var liveCol = (light==='red') ? C.red : (trial && trial.moving ? C.amber : '#9AA6D8');
  txtShadow(String(pts), 278, 68, 26, liveCol, 'left', 0.5);

  // traffic light HUD panel
  var lx = W-104, ly = 16, lw = 62, lh = 118;
  ctx.save();
  ctx.shadowColor='rgba(0,0,0,.35)'; ctx.shadowBlur=10; ctx.shadowOffsetY=3;
  var boxG = ctx.createLinearGradient(lx,ly,lx,ly+lh);
  boxG.addColorStop(0,C.boxA); boxG.addColorStop(1,C.boxB);
  ctx.fillStyle=boxG; rr(lx,ly,lw,lh,10); ctx.fill();
  ctx.restore();
  ctx.lineWidth=1.5; ctx.strokeStyle='rgba(255,255,255,.14)'; ctx.stroke();
  var cx = lx+lw/2;
  var lamps = [
    {y:ly+26, on: light==='red',    col:C.red},
    {y:ly+62, on: light==='yellow', col:C.amber},
    {y:ly+98, on: light==='green',  col:C.green}
  ];
  for(var k=0;k<3;k++){
    var L=lamps[k];
    ctx.save();
    if(L.on){ ctx.shadowColor=L.col; ctx.shadowBlur=16; }
    ctx.fillStyle = L.on ? L.col : C.off;
    ctx.beginPath(); ctx.arc(cx,L.y,12,0,6.2832); ctx.fill();
    ctx.restore();
    ctx.lineWidth=1.5; ctx.strokeStyle='rgba(0,0,0,.4)'; ctx.stroke();
    if(L.on){
      ctx.fillStyle='rgba(255,255,255,.55)';
      ctx.beginPath(); ctx.arc(cx-3.5,L.y-3.5,3,0,6.2832); ctx.fill();
    }
  }
  var word = light==='red' ? 'RED' : (light==='yellow' ? 'YELLOW' : (light==='green' ? 'GREEN' : ''));
  var wcol = light==='red' ? C.red : (light==='yellow' ? C.amber : C.green);
  if(word) txt(word, cx, ly+lh+20, 11, wcol, 'center', 1);

  // trial counter / restarts, mid-right
  var label = trial && trial.isPractice ? 'PRACTICE ROUND' : ('TRIAL '+Math.min(trialIndex+1,TOTAL_TRIALS)+' / '+TOTAL_TRIALS);
  txt(label, 482, 38, 13, '#E4DFF2', 'left', 1);
  if(trial && trial.restarts>0){
    txt('RESTARTS: '+trial.restarts, 482, 62, 13, '#8D84A8', 'left', 1.5);
  }
}

function drawFloats(){
  for(var i=0;i<floats.length;i++){
    var f=floats[i];
    ctx.globalAlpha = Math.min(1, f.life*1.6);
    txtShadow(f.txt, f.x, f.y, f.size, f.col, 'center', 1);
    ctx.globalAlpha = 1;
  }
}

function panel(x,y,w,h){
  ctx.save();
  ctx.shadowColor='rgba(0,0,0,.4)'; ctx.shadowBlur=24; ctx.shadowOffsetY=8;
  ctx.fillStyle='rgba(20,15,40,.86)'; rr(x,y,w,h,14); ctx.fill();
  ctx.restore();
  ctx.lineWidth=1.5; ctx.strokeStyle='rgba(255,255,255,.14)'; ctx.stroke();
  ctx.strokeStyle='rgba(255,255,255,.18)'; ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(x+14,y+1.5); ctx.lineTo(x+w-14,y+1.5); ctx.stroke();
}
function drawBtn(b,col,label,sub,dim){
  ctx.globalAlpha = dim ? 0.32 : 1;
  ctx.save();
  ctx.shadowColor=col; ctx.shadowBlur=dim?0:14; ctx.shadowOffsetY=2;
  var bg = ctx.createLinearGradient(0,b.y,0,b.y+b.h);
  bg.addColorStop(0,'rgba(255,255,255,.14)'); bg.addColorStop(1,'rgba(255,255,255,.04)');
  ctx.fillStyle=bg; rr(b.x,b.y,b.w,b.h,10); ctx.fill();
  ctx.restore();
  ctx.lineWidth=2; ctx.strokeStyle=col; ctx.stroke();
  txt(label, b.x+b.w/2, b.y+b.h/2+(sub?-3:7), sub?18:18, col, 'center', 1.2);
  if(sub) txt(sub, b.x+b.w/2, b.y+b.h/2+17, 11, 'rgba(255,255,255,.6)', 'center', 1.5);
  ctx.globalAlpha = 1;
}

/* Compact trial progress track, tucked into the dashboard's left edge so it
   never runs into the GO/STOP/BANK buttons, which sit centered below.      */
function drawTrialTrack(){
  var y = CONTROL_BAR_Y + 20, r = 5, gap = 13;
  var n = TOTAL_TRIALS;
  var x0 = 26;
  txt('TRIALS', x0, y - 10, 10, '#8D84A8', 'left', 2);
  for(var i=0;i<n;i++){
    var cx = x0 + r + i*gap;
    var rec = trialLog[i];
    var live = (!rec && i === trialIndex && trial && !trial.isPractice && state===ST.ACTIVE);
    var col = rec ? (rec.outcome==='crash' ? C.red : C.green) : (live ? C.amber : C.off);
    ctx.save();
    if(live){ ctx.shadowColor=col; ctx.shadowBlur=8; }
    ctx.fillStyle = col;
    ctx.beginPath(); ctx.arc(cx,y,r,0,6.2832); ctx.fill();
    ctx.restore();
    ctx.lineWidth=1.5; ctx.strokeStyle='rgba(0,0,0,.4)'; ctx.stroke();
  }
  txt('CRASHES '+crashCount, x0, y + 22, 12, '#C4BEDD', 'left', 1.2);
}

function drawControls(){
  if(state === ST.ACTIVE){
    if(trial.moving){
      drawBtn(BTN_STOP, C.red, 'STOP', 'SPACE');
    } else {
      drawBtn(BTN_GO, C.green, 'GO', 'SPACE');
      drawBtn(BTN_BANK, C.gold, 'BANK', 'B');
    }
  }
  if(state !== ST.SUMMARY) drawTrialTrack();
}

function drawOverlays(){
  var pulse = 0.6+0.4*Math.abs(Math.sin(performance.now()/380));

  if(state === ST.TITLE){
    ctx.fillStyle='rgba(16,10,30,.55)'; ctx.fillRect(0,0,W,H);
    panel(W/2-320,70,640,400);
    txtShadow('CHICKEN', W/2, 156, 52, C.amber, 'center', 2);
    txt('A RISK-TAKING DRIVING GAME', W/2, 184, 14, '#B6A8DC', 'center', 1.5);
    txt('Your car starts moving on its own. Points add up the longer it moves.', W/2, 222, 16, '#EDE7F8', 'center', 0, 700);
    txt('At some point the light turns yellow, then red — and a wall drops.', W/2, 244, 16, '#EDE7F8', 'center', 0, 700);
    txt('Still moving when the wall lands? You crash and lose everything', W/2, 266, 16, '#C9938E', 'center', 0, 700);
    txt('you earned that round. Stop in time and you can BANK your points', W/2, 288, 16, '#EDE7F8', 'center', 0, 700);
    txt('or press GO to risk moving further for more.', W/2, 310, 16, '#EDE7F8', 'center', 0, 700);
    txt('1 practice round, then 5 real trials. Timing is random every time.', W/2, 342, 15, '#C9AE7E', 'center', 0, 700);
    ctx.globalAlpha=pulse;
    txt('PRESS SPACE OR TAP TO START', W/2, 384, 16, C.green, 'center', 1.5);
    ctx.globalAlpha=1;
    return;
  }

  if(state === ST.PRACTICE_INTRO){
    ctx.fillStyle='rgba(16,10,30,.55)'; ctx.fillRect(0,0,W,H);
    panel(W/2-280,150,560,260);
    txtShadow('PRACTICE ROUND', W/2, 216, 32, '#F0EBFA', 'center', 1.5);
    txt('Points here do not count. This is just to feel out a crash', W/2, 254, 15, '#C4BEDD', 'center', 0, 700);
    txt('before the real trials begin.', W/2, 274, 15, '#C4BEDD', 'center', 0, 700);
    ctx.globalAlpha=pulse;
    drawBtn(BTN_BEGIN, C.green, 'BEGIN', 'SPACE');
    ctx.globalAlpha=1;
    return;
  }

  if(state === ST.PRACTICE_DONE){
    ctx.fillStyle='rgba(16,10,30,.55)'; ctx.fillRect(0,0,W,H);
    panel(W/2-280,150,560,260);
    txtShadow('PRACTICE COMPLETE', W/2, 216, 28, '#F0EBFA', 'center', 1.5);
    txt('Ready for the 5 real trials? Every point you bank stays banked.', W/2, 254, 15, '#C4BEDD', 'center', 0, 700);
    txt('Every crash costs only that trial’s points.', W/2, 274, 15, '#C4BEDD', 'center', 0, 700);
    ctx.globalAlpha=pulse;
    drawBtn(BTN_BEGIN, C.green, 'START TRIALS', 'SPACE');
    ctx.globalAlpha=1;
    return;
  }

  if(state === ST.TRIAL_INTRO){
    var a = Math.min(1, st*4);
    ctx.globalAlpha=a;
    txtShadow('TRIAL '+(trialIndex+1)+' / '+TOTAL_TRIALS, W/2, 168, 38, '#F0EBFA', 'center', 1.5);
    ctx.globalAlpha=1;
    return;
  }

  if(banner && state === ST.RESOLVE){
    var t = st;
    var dur = trial.outcome==='crash' ? 1.4 : 1.1;
    var al = Math.min(1, t*5) * (t>dur-0.4 ? Math.max(0,(dur-t)/0.4) : 1);
    ctx.globalAlpha=al;
    txtShadow(banner.big, W/2, 150, trial.outcome==='crash'?36:34, banner.col, 'center', 1.5);
    txt(banner.sub, W/2, 184, 15, '#C4BEDD', 'center', 1);
    ctx.globalAlpha=1;
  }

  if(state === ST.SUMMARY){
    ctx.fillStyle='rgba(16,10,30,.62)'; ctx.fillRect(0,0,W,H);
    panel(W/2-310,70,620,420);
    txtShadow(TOTAL_TRIALS+' TRIALS COMPLETE', W/2, 130, 30, '#F0EBFA', 'center', 1.5);

    var avgPct = 0, nPct = 0;
    for(var i=0;i<trialLog.length;i++){
      if(trialLog[i].pctMovingAfterYellow != null){ avgPct += trialLog[i].pctMovingAfterYellow; nPct++; }
    }
    avgPct = nPct ? Math.round((avgPct/nPct)*10)/10 : 0;
    var totalRestarts = trialLog.reduce(function(s,r){ return s+r.restarts; }, 0);

    txt('BANK ACCOUNT', W/2-190, 176, 12, '#B6A8DC', 'center', 1);
    txtShadow(String(bankAccount), W/2-190, 218, 40, C.gold, 'center', 2);

    txt('CRASHES', W/2, 176, 12, '#B6A8DC', 'center', 1);
    txtShadow(crashCount+' / '+TOTAL_TRIALS, W/2, 218, 40, crashCount>0?C.red:C.green, 'center', 2);

    txt('AVG TIME MOVING AFTER YELLOW', W/2+190, 176, 11, '#B6A8DC', 'center', 0.8);
    txtShadow(avgPct+'%', W/2+190, 218, 40, '#9AA6D8', 'center', 2);

    txt('Risk-taking score: the average % of time the car kept moving', W/2, 264, 14, '#C4BEDD', 'center', 0, 700);
    txt('after the light turned yellow, across all '+TOTAL_TRIALS+' trials.', W/2, 284, 14, '#C4BEDD', 'center', 0, 700);
    txt('TOTAL RESTARTS ACROSS ALL TRIALS: '+totalRestarts, W/2, 316, 14, '#9084B0', 'center', 1.5);
    txt('BEST BANK ACCOUNT THIS SESSION: '+bestBank, W/2, 340, 14, '#9084B0', 'center', 1.5);
    txt('Use the Download CSV button above to export trial-by-trial data.', W/2, 372, 13, '#8D84A8', 'center', 1);

    ctx.globalAlpha=pulse;
    txt('PRESS SPACE OR TAP TO PLAY AGAIN', W/2, 418, 16, C.green, 'center', 1.5);
    ctx.globalAlpha=1;
  }
}

/* ================= render ================= */
function draw(){
  ctx.save();
  if(shake > 0.4) ctx.translate((Math.random()-0.5)*shake, (Math.random()-0.5)*shake);
  drawSky();
  drawGround();
  drawRuler();
  if(state !== ST.TITLE){ drawWall(); drawCar(); drawBits(); }
  else drawCar();
  ctx.restore();

  if(flash > 0){
    ctx.fillStyle = 'rgba(240,71,63,'+(flash*0.26)+')';
    ctx.fillRect(0,0,W,H);
  }
  drawControlBar();
  if(state !== ST.TITLE){ drawScoreboard(); drawControls(); }
  drawFloats();
  drawOverlays();
}

/* ================= loop ================= */
var last = performance.now();
function loop(now){
  var dt = Math.min(0.05, (now-last)/1000);
  last = now;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

})();
</script>
</body>
</html>
